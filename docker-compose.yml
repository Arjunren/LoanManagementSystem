services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loan
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: loan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [loan_data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/loan
      DATABASE_USERNAME: loan
      DATABASE_PASSWORD: loan
      ALLOWED_ORIGINS: http://localhost:3000
      SPRING_PROFILES_ACTIVE: dev
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  loan_data: {}

